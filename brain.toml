# Configurația creierului. Toate valorile de aici sunt cele implicite;
# poți șterge orice linie și revine la implicit. Chei necunoscute = eroare.
# Distanțe în metri, viteze în m/s și rad/s, timpuri în secunde.

[sockets]
# Gol = se ghicește: simularea (~/.cache/duck-sim/...) dacă există, altfel /run/...
robot = ""
tof = ""

[motion]
# Masurat in simulare pe 2026-10-03: sub ~0.20 m/s si sub ~1.1 rad/s rata NU paseste deloc (sta pe loc).
# Viteza reala e mai mica decat cea ceruta: 0.24 cerut = ~0.10 m/s real; 1.4 cerut = ~0.65-0.97 rad/s real.
forward_speed = 0.24      # viteza de mers înainte ceruta (m/s). Robotul acceptă până la ~0.3.
turn_speed = 1.4          # viteza de întoarcere ceruta (rad/s)
big_turn_speed = 1.4      # viteza la întoarcerea mare ceruta (rad/s)

[obstacle]
stop_distance = 0.28      # sub această distanță în față (nu mai are loc) => se oprește de tot și se rotește pe loc
slow_distance = 0.70      # între slow_distance și stop_distance virează din mers, mai tare cu cât e mai aproape
steer_yaw_max = 0.8       # rotirea cerută (rad/s) a virajului din mers, la apropierea maximă (la stop_distance)
steer_slew = 3.0          # cât de repede poate varia rotirea cerută (rad/s per s): fără smucituri
low_obstacles = "avoid"   # "avoid" = ocolește cuburile/mingile din rândurile de jos; "ignore" = le ignoră (ca în v1)
drops = "avoid"           # "avoid" = se ferește de goluri (margini, scări în jos); "ignore" = nu le caută
clear_distance = 0.40     # trebuie să vadă cel puțin atât liber ca să termine întoarcerea
first_row = 0             # rândurile folosite din cadrul 8x8 (0 = sus). Cele de jos pot vedea podeaua.
last_row = 4
front_first_col = 1       # coloanele care contează ca „în față” (0 = stânga senzorului)
front_last_col = 6
min_zones = 2             # câte zone trebuie să fie aproape ca să conteze (taie zgomotul)
blind_fraction = 0.5      # dacă sub atâta din zone dau o măsurătoare, e „orb” => tratat ca obstacol
max_range = 4.0           # „nimic în raza senzorului” se socotește la această distanță
stop_pause = 0.3          # cât stă pe loc înainte să înceapă întoarcerea
min_turn_time = 0.5       # rotirea în loc durează cel puțin atât...
min_turn_degrees = 20.0   # ...și parcurge cel puțin atâtea grade MĂSURATE (odom.yaw)
max_turn_time = 6.0       # dacă nu se eliberează în atâta timp, renunță și numără ca eșec
default_turn = "left"     # direcția când ambele părți sunt la fel de libere: left | right

[low]
# Obiecte joase: în rândurile de jos (peste last_row) se vede și podeaua. Se calculează distanța așteptată
# pe podea goală, din poza senzorului din robot.state (frames.tof, safety.gravity, odom.position[2]);
# o citire vizibil mai scurtă e un obiect. Valorile nominale sunt pentru robotul care nu trimite poza.
nominal_height = 0.246            # înălțimea senzorului deasupra podelei, în picioare (m; măsurat în MuJoCo)
nominal_pitch_deg = 0.0           # înclinarea nominală a senzorului în jos (grade)
nominal_sensor_forward = 0.064    # cât de în față de originea trunchiului e senzorul (m)
tilt_tolerance_deg = 1.5          # toleranță la eroarea de poză (sincronizare, legănat), cu poză
tilt_tolerance_nopose_deg = 4.5   # fără poză: mai mare, acoperă ±3° pitch + ±3° roll odată (prinde mai puține obiecte)
range_margin = 0.06               # marjă relativă (zgomotul senzorului + eroarea de înălțime)
min_range = 0.10                  # citirile mai aproape de atât sunt zgomot (crosstalk), ignorate
confirm_time = 0.12               # un obiect trebuie văzut continuu atâta timp (≈ 2 cadre) ca să conteze
corridor_half_width = 0.15        # un obiect la mai puțin de atât lateral de axa robotului e „în drum" (m)
memory_seconds = 12.0             # cât ține minte un obiect după ce iese din câmpul senzorului (0 = deloc)
extra_clearance = 0.15            # un obiect jos se tratează ca fiind cu atâta mai aproape (m): se vede doar scurt, reacția trebuie să fie fermă

[drop]
# Goluri: unde podeaua ar trebui să se vadă sigur, „nimic în rază" sau o distanță clar mai lungă = podeaua lipsește.
max_expected = 1.2        # doar zonele cu podeaua așteptată mai aproape de atât (m): rândurile 6-7 în picioare
range_margin = 0.10       # cât de mai lungă decât podeaua (cu capul ridicat la limita toleranței) trebuie să fie citirea
min_zones = 2             # câte zone fără podea în același cadru (una singură = zgomot)
confirm_time = 0.12       # văzut continuu atâta timp ca să conteze
clearance = 0.45          # golul se tratează ca fiind cu atâta mai aproape (m): oprește cu mult înainte de margine
corridor_half_width = 0.18
memory_seconds = 120.0    # cât ține minte un gol (o gaură nu pleacă nicăieri)

[corner]
turns_before_big_turn = 3 # tot atâtea ocoliri la rând fără să înainteze => întoarcere mare
progress_time = 3.0       # cât trebuie să meargă înainte nestingherit ca să se reseteze numărătoarea
big_turn_degrees = 160.0  # unghiul întoarcerii mari, MĂSURAT din odom.yaw (nu cronometrat)
big_turn_max_time = 15.0  # siguranță: dacă unghiul nu e atins în atâta timp, renunță (odometrie blocată / semn greșit)
fallback_turn_efficiency = 0.5  # doar dacă robotul nu raportează odom.yaw: cronometrează presupunând atâta din rata cerută

[heading]
# Cât merge drept, ține direcția cu odom.yaw (un regulator PI mic peste vyaw).
enabled = true
kp = 2.0                  # rad/s de corecție per rad de eroare
ki = 0.3                  # compensează deriva constantă (stânga/dreapta) a mersului
max_correction = 0.5      # corecția maximă adăugată la rotire (rad/s)
yaw_sign = 1.0            # 1 = odom.yaw crește spre stânga (ca vyaw); -1 dacă ai găsit invers

[safety]
tof_timeout = 0.5         # cadru de adâncime mai vechi de atât => oprit
state_timeout = 1.0       # flux robot.state mai vechi de atât => considerat nesigur
health_poll = 1.0         # cât de des întreabă robot.health
resume_delay = 1.5        # după ce robotul e iar în picioare, așteaptă atât înainte de mers

[loop]
rate_hz = 20.0            # cât de des trimite robot.move (robotul oprește singur după ~0.5 s fără comenzi)
log_every = 5.0           # la câte secunde scrie o linie de stare (0 = deloc)
