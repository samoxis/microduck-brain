[project]
name = "microduck-brain"
version = "0.3.0"
description = "Autonomous behaviour layer for the Microduck biped: obstacle, low-object and drop avoidance over the robot's public JSON-RPC API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []  # standard library only, on purpose

[project.scripts]
microduck-brain = "microduck_brain.cli:main"
microduck-brain-replay = "microduck_brain.cli:replay_main"
microduck-brain-plot = "microduck_brain.cli:plot_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microduck_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
